<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Jong</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        /* A finger anywhere on the page drives the paddle, so no browser pan or zoom gesture may start. */
        touch-action: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hide-cursor {
        cursor: none;
      }

      #game {
        display: block;
        touch-action: none;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Jong game"></canvas>
    <input id="api-key" class="visually-hidden" type="password" autocomplete="off" aria-label="TypeSafe API key">
    <script type="module" src="src/main.js"></script>
  </body>
</html>
